<!DOCTYPE html>
<!--
  The HTML shell for the web export. With `web.output: 'single'` (app.config.ts) Expo uses THIS
  file as the template (`public/index.html`) — `app/+html.tsx` is only consulted for
  `output: 'static'`. Keep the two in step.

  Content-Security-Policy (review H-10): the site is currently served from GitHub Pages, which
  cannot set response headers, so the policy travels as a <meta> tag. Every directive below works
  in meta form EXCEPT `frame-ancestors`, which browsers only honour as a header; it is kept so the
  intent is documented, and hosting should move to a provider that sends this exact value as a
  `Content-Security-Policy` header (see docs/ops/production-checklist.md).

  script-src 'self': the export references the bundle with a <script src> and emits no inline
  script (verified in the exported index.html). style-src needs 'unsafe-inline' for the reset
  below and react-native-web's runtime stylesheet. img-src/connect-src cover Supabase storage,
  REST and realtime; data:/blob: images are the picker previews. They also allow the local
  Supabase stack (`supabase start`, loopback port 54321), which local development and the CI E2E
  job point the web build at: without it the app cannot read anything and every account reads
  as not yet age-confirmed. Loopback is not an exfiltration route, so this does not weaken the
  policy for the deployed site.

  https://challenges.cloudflare.com in script-src and frame-src is Cloudflare Turnstile, the bot
  check on sign-in (review H-7): the app loads its api.js from there, only when
  EXPO_PUBLIC_TURNSTILE_SITE_KEY is set, and the challenge runs in an iframe served from the same
  host. Those two are all Cloudflare's CSP reference asks for; the widget was run under this exact
  policy with no violation and nothing added to connect-src (its own requests are made inside the
  iframe), and dropping either directive stops it loading. frame-src keeps 'self', which
  default-src granted frames before frame-src was set.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321 ws://localhost:54321; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Nook</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* The canvas colour before the bundle has run, so a dark device never flashes white while
         the app loads. Once it runs, the app sets these itself and follows the Appearance choice
         (ThemedChrome in app/_layout.tsx); the values mirror the theme tokens' canvas. */
      html,
      body {
        background-color: #f4f3f0;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #131311;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/Nook/favicon.ico"/></head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  <script src="/Nook/_expo/static/js/web/entry-8a9c04de98fc9edee0c927a46324b37e.js" defer></script>
</body>
</html>
